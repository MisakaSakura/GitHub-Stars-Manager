name: "🚫 生态 Blocklist 提议"
description: "提议将某个生态候选加入排除列表（只需填写候选名称）"
title: "[生态Blocklist] "
labels: ["生态-blocklist"]
body:
  - type: input
    id: candidate_name
    attributes:
      label: "候选生态名称"
      description: "被误识别的生态候选名称（如 'Android'、'CLI-Tools'）"
      placeholder: "如: Android"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "补充说明（可选）"
      description: "如有额外信息可在此补充，系统会自动从候选池推断待排除项"
      placeholder: "如: 这个候选的 topic_patterns 包含 'android' 平台关键词"
