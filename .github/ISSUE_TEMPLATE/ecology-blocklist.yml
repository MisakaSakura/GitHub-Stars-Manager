name: "🚫 生态 Blocklist 提议"
description: "自动创建：提议将某个 topic 或前缀加入生态发现排除列表"
title: "[生态Blocklist] "
labels: ["生态-blocklist"]
body:
  - type: input
    id: indicator
    attributes:
      label: "待排除项"
      description: "被误识别为生态候选的 topic 或前缀"
      placeholder: "如: android, cli, apk"
    validations:
      required: true

  - type: dropdown
    id: indicator_type
    attributes:
      label: "类型"
      description: "待排除项的类型"
      options:
        - "topic"
        - "name_prefix"
    validations:
      required: true

  - type: input
    id: triggered_candidate
    attributes:
      label: "触发的候选生态"
      description: "哪个生态候选被此 item 误触发"
      placeholder: "如: Android 生态 (3个项目)"

  - type: textarea
    id: reason
    attributes:
      label: "理由"
      description: "为什么这个 topic/前缀 不应被识别为生态？"
      placeholder: "如: 'android' 是平台关键词，属于 PLATFORM_RULES 已覆盖范围，不应作为独立生态"

  - type: checkboxes
    id: confirm
    attributes:
      label: "审核确认"
      options:
        - label: "确认加入 blocklist"
          required: false
        - label: "误报，不应加入 blocklist"
          required: false
