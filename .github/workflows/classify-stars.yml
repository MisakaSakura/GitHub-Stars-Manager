name: Auto Classify GitHub Stars

# 触发条件:
# 1. 每周一凌晨 2:00 UTC 自动运行（增量更新）
# 2. 手动触发（支持多种参数组合）
#
# 首次运行建议:
# - 如果你有已有分类想保留，先在本地用 --import-json 导入后再推送到仓库
# - 或者首次手动触发时不选增量模式，让系统全新分类，之后检查并手动保护满意的项目
# - 首次运行后，后续会自动走增量模式，不会重复覆盖

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一凌晨 2:00 UTC（北京时间周一 10:00）

  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'incremental'
        type: choice
        options: ['incremental', 'deep', 'full', 'custom']

      # ===== 🤖 AI / LLM 选项 =====
      use_llm:
        description: '🤖 启用 LLM 智能分类（需配置 LLM_KEY Secret）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      force_llm:
        description: '🤖 无视间隔强制 LLM（勾选后自动启用 use_llm）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      llm_provider:
        description: '🤖 LLM 提供商'
        required: false
        default: 'openai'
        type: choice
        options: ['openai', 'moonshot', 'deepseek', 'openrouter']

      llm_model:
        description: '🤖 LLM 模型（留空使用 provider 默认）'
        required: false
        default: ''
        type: string

      llm_base:
        description: '🤖 LLM Base URL（兼容 OpenAI 的第三方服务，如 mimo）'
        required: false
        default: ''
        type: string

      sync_notion:
        description: '同步到 Notion（需要设置 NOTION_KEY 和 NOTION_DB）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      notion_clear:
        description: '导出前清空 Notion（危险！会归档所有旧页面）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      send_notify:
        description: '发送通知（需要配置对应通知渠道的 Secrets）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      lists_strategy:
        description: 'GitHub Lists 处理策略（首次运行时生效）'
        required: false
        default: 'ignore'
        type: choice
        options: ['ignore', 'migrate', 'replace']

      retry_failed:
        description: '重试之前 AI 分析失败的项目'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      notify_channels:
        description: '通知通道（send_notify=true 时生效）'
        required: false
        default: 'email'
        type: string

      # --- 以下仅在 mode=custom 时生效 ---
      force_refresh:
        description: '[custom] 强制全量刷新'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      check_all_releases:
        description: '[custom] 检查所有 Release'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

      check_forks:
        description: '[custom] 检查 Fork 上游更新'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      subscribe_releases:
        description: '[custom] 标记所有仓库订阅 Release'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-classifier-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install requests || true
          # 确保 requirements.txt 存在（用于缓存 key）
          echo "requests>=2.31.0" > requirements.txt

      - name: Run classifier
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ github.actor }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_BASE: ${{ github.event.inputs.llm_base || vars.LLM_BASE }}
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          QQ_API_URL: ${{ secrets.QQ_API_URL }}
          QQ_GROUP_ID: ${{ secrets.QQ_GROUP_ID }}
        run: |
          mkdir -p docs data

          # P1: 构建参数列表，避免 eval 带来的命令注入风险
          # 运行模式：schedule 自动运行默认 incremental；手动运行使用 inputs.mode
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="incremental"
          fi

          ARGS=(
            "--token" "$GH_TOKEN"
            "--user" "$GH_USER"
            "--db" "./data/stars_db.json"
            "--output" "./docs"
            "--mode" "$MODE"
          )

          # schedule 自动运行默认检查所有 Release（周报功能）
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=("--check-all-releases")
          fi

          # LLM 智能增强
          # 联动逻辑：force_llm=true 自动视为 use_llm=true
          USE_LLM="${{ github.event.inputs.use_llm }}"
          FORCE_LLM="${{ github.event.inputs.force_llm }}"
          if [ "$FORCE_LLM" = "true" ]; then
            USE_LLM="true"
          fi
          # full 模式默认启用 LLM（如果配置了 LLM_KEY）
          # use_llm=false 视为用户明确关闭，其他情况（包括默认未勾选）均自动启用
          if [ "$MODE" = "full" ] && [ -n "$LLM_KEY" ] && [ "$USE_LLM" != "false" ]; then
            USE_LLM="true"
            echo "[模式联动] full 模式自动启用 LLM（已配置 LLM_KEY）"
          fi

          if [ "$USE_LLM" = "true" ] && [ -n "$LLM_KEY" ]; then
            ARGS+=("--llm-key" "$LLM_KEY" "--llm-provider" "${{ github.event.inputs.llm_provider }}")
            if [ -n "${{ github.event.inputs.llm_model }}" ]; then
              ARGS+=("--llm-model" "${{ github.event.inputs.llm_model }}")
            fi
            # llm_base 来源优先级：手动输入 > Repository Variables > config_llm.py
            if [ -n "$LLM_BASE" ]; then
              ARGS+=("--llm-base" "$LLM_BASE")
            fi
            if [ "$FORCE_LLM" = "true" ]; then
              ARGS+=("--force-llm")
            fi
          fi

          # Notion 同步
          if [ "${{ github.event.inputs.sync_notion }}" = "true" ] && [ -n "$NOTION_KEY" ] && [ -n "$NOTION_DB" ]; then
            ARGS+=("--notion-key" "$NOTION_KEY" "--notion-db" "$NOTION_DB")
            if [ "${{ github.event.inputs.notion_clear }}" = "true" ]; then
              ARGS+=("--notion-clear")
            fi
          fi

          # GitHub Lists 策略（schedule 触发时 inputs 为空，使用默认值 ignore）
          LIST_STRATEGY="${{ github.event.inputs.lists_strategy }}"
          ARGS+=("--lists-strategy" "${LIST_STRATEGY:-ignore}")

          # custom 模式下的手动开关（其他模式由 --mode 自动处理）
          if [ "$MODE" = "custom" ]; then
            if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
              ARGS+=("--force-refresh")
            fi
            if [ "${{ github.event.inputs.check_all_releases }}" = "true" ]; then
              ARGS+=("--check-all-releases")
            fi
            if [ "${{ github.event.inputs.check_forks }}" = "true" ]; then
              ARGS+=("--check-forks")
            fi
            if [ "${{ github.event.inputs.subscribe_releases }}" = "true" ]; then
              ARGS+=("--subscribe-releases")
            fi
          fi

          if [ "${{ github.event.inputs.retry_failed }}" = "true" ]; then
            ARGS+=("--retry-failed")
          fi

          # 通知
          if [ "${{ github.event.inputs.send_notify }}" = "true" ]; then
            ARGS+=("--notify" "--notify-channels" "${{ github.event.inputs.notify_channels }}")
          fi

          echo "执行命令: python scripts/classifier.py ${ARGS[@]}"
          python scripts/classifier.py "${ARGS[@]}"

      - name: Commit database updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -f data/stars_db.json data/stars_ai.json data/releases_history.json
          if [ -f data/stars_db.meta.json ]; then
            git add -f data/stars_db.meta.json
          fi
          # requirements.txt 若在工作区有修改则添加（注意：此处是工作区 vs HEAD，不是 --cached）
          if ! git diff --quiet -- requirements.txt 2>/dev/null; then
            git add requirements.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update stars database [$(date -u +%Y-%m-%d)]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
