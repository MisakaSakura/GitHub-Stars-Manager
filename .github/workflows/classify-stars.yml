name: Auto Classify GitHub Stars

# 触发条件:
# 1. 每周一凌晨 2:00 UTC 自动运行（增量更新）
# 2. 手动触发（支持多种参数组合）
#
# 首次运行建议:
# - 如果你有已有分类想保留，先在本地用 --import-json 导入后再推送到仓库
# - 或者首次手动触发时不选增量模式，让系统全新分类，之后检查并手动保护满意的项目
# - 首次运行后，后续会自动走增量模式，不会重复覆盖

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一凌晨 2:00 UTC（北京时间周一 10:00）

  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'incremental'
        type: choice
        options: ['incremental', 'deep', 'full', 'custom']

      # ===== 🤖 AI / LLM（3 个参数）=====
      llm_mode:
        description: '🤖 LLM 模式'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'off', 'force']

      llm_preset:
        description: '🤖 预设（内置: openai/moonshot/deepseek/openrouter/xiaomimimo/xiaomimimo-v2.5/xiaomimimo-pro；也可输入自定义名）'
        required: false
        default: ''
        type: string

      retry_failed:
        description: '🤖 重试之前 AI 分析失败的项目'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      # ===== 📤 导出（1 个参数）=====
      sync_notion:
        description: '📤 同步到 Notion（clear = 先清空再同步，危险！）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true', 'clear']

      # ===== 🔔 通知（1 个参数）=====
      notify:
        description: '🔔 通知渠道'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'email', 'telegram', 'wecom', 'qq', 'all']

      # ===== ⚙️ 其他（2 个参数）=====
      lists_strategy:
        description: '⚙️ GitHub Lists 处理策略（首次运行时生效）'
        required: false
        default: 'ignore'
        type: choice
        options: ['ignore', 'migrate', 'replace']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1  # 强制 Python stdout 无缓冲，LLM 进度在 Actions 日志中实时可见

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-classifier-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install requests || true
          echo "requests>=2.31.0" > requirements.txt

      - name: Run classifier
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ github.actor }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_PRESET: ${{ github.event.inputs.llm_preset || vars.LLM_PRESET }}
          LLM_PRESETS: ${{ vars.LLM_PRESETS }}
          LLM_BASE: ${{ vars.LLM_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          QQ_API_URL: ${{ secrets.QQ_API_URL }}
          QQ_GROUP_ID: ${{ secrets.QQ_GROUP_ID }}
        run: |
          mkdir -p docs data

          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="incremental"
          fi

          ARGS=(
            "--token" "$GH_TOKEN"
            "--user" "$GH_USER"
            "--db" "./data/stars_db.json"
            "--output" "./docs"
            "--mode" "$MODE"
          )

          # schedule 自动运行默认检查所有 Release（周报功能）
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=("--check-all-releases")
          fi

          # ===== LLM 模式映射 =====
          # auto: 按 mode 联动（full/deep 模式自动启用）；off = 明确关闭；force = 无视间隔
          LLM_MODE="${{ github.event.inputs.llm_mode }}"
          USE_LLM="false"
          FORCE_LLM="false"

          if [ "$LLM_MODE" = "force" ]; then
            USE_LLM="true"
            FORCE_LLM="true"
          elif [ "$LLM_MODE" = "off" ]; then
            USE_LLM="false"
          else
            # auto: full/deep 模式自动启用（配置了 LLM_KEY 时）
            if [ -n "$LLM_KEY" ]; then
              if [ "$MODE" = "full" ] || [ "$MODE" = "deep" ]; then
                USE_LLM="true"
                echo "[模式联动] $MODE 模式自动启用 LLM"
              fi
            fi
          fi

          if [ "$USE_LLM" = "true" ] && [ -n "$LLM_KEY" ]; then
            ARGS+=("--llm-key" "$LLM_KEY")
            if [ -n "$LLM_PRESET" ]; then
              ARGS+=("--llm-preset" "$LLM_PRESET")
            fi
            # 向后兼容：Variable 级别的 base/model 覆盖
            if [ -n "$LLM_BASE" ]; then
              ARGS+=("--llm-base" "$LLM_BASE")
            fi
            if [ -n "$LLM_MODEL" ] && [ "$LLM_MODEL" != "default" ]; then
              ARGS+=("--llm-model" "$LLM_MODEL")
            fi
            if [ "$FORCE_LLM" = "true" ]; then
              ARGS+=("--force-llm")
            fi
          fi

          # ===== Notion 同步 =====
          SYNC_NOTION="${{ github.event.inputs.sync_notion }}"
          if [ "$SYNC_NOTION" != "false" ] && [ -n "$NOTION_KEY" ] && [ -n "$NOTION_DB" ]; then
            ARGS+=("--notion-key" "$NOTION_KEY" "--notion-db" "$NOTION_DB")
            if [ "$SYNC_NOTION" = "clear" ]; then
              ARGS+=("--notion-clear")
            fi
          fi

          # ===== GitHub Lists 策略 =====
          LIST_STRATEGY="${{ github.event.inputs.lists_strategy }}"
          ARGS+=("--lists-strategy" "${LIST_STRATEGY:-ignore}")

          # ===== custom 模式默认值 =====
          # custom 默认启用 force_refresh + check_all_releases，不启用 check_forks / subscribe_releases
          if [ "$MODE" = "custom" ]; then
            ARGS+=("--force-refresh" "--check-all-releases")
          fi

          # ===== 重试失败 =====
          if [ "${{ github.event.inputs.retry_failed }}" = "true" ]; then
            ARGS+=("--retry-failed")
          fi

          # ===== 通知 =====
          NOTIFY="${{ github.event.inputs.notify }}"
          if [ "$NOTIFY" != "false" ]; then
            ARGS+=("--notify" "--notify-channels" "$NOTIFY")
          fi

          echo "执行命令: python scripts/classifier.py ${ARGS[@]}"
          python scripts/classifier.py "${ARGS[@]}"

      - name: Commit database updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -f data/stars_db.json data/stars_ai.json data/releases_history.json
          if [ -f data/stars_db.meta.json ]; then
            git add -f data/stars_db.meta.json
          fi
          if ! git diff --quiet -- requirements.txt 2>/dev/null; then
            git add requirements.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update stars database [$(date -u +%Y-%m-%d)]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
