name: Process Classification Feedback

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: "process-feedback"
  cancel-in-progress: false

jobs:
  apply-correction:
    if: |
      contains(github.event.issue.labels.*.name, '分类修正') ||
      startsWith(github.event.issue.title, '[分类修正]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf data
          if git ls-remote --heads "${REPO_URL}" data | grep -q data; then
            git clone --branch data --single-branch "${REPO_URL}" data
          else
            mkdir data && cd data && git init && git remote add origin "${REPO_URL}" && git checkout -b data
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse issue and apply correction
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/ci/apply_feedback_correction.py

      - name: Regenerate learned rules
        run: |
          python3 -c "
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from feedback_loop import FeedbackLoop
          fb_path = 'data/feedback.json'
          lr_path = 'data/learned_rules.json'
          if os.path.exists(fb_path):
              fb = FeedbackLoop(fb_path)
              learned = fb.generate_learned_overrides(min_count=2)
              if learned and (learned.get('negative') or learned.get('positive')):
                  fb.write_learned_rules_file(lr_path, learned)
                  print(f'已生成 learned_rules.json')
              else:
                  print('反馈数量不足，未生成规则补丁')
          "

      - name: Commit data changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feedback: apply classification correction from issue #${{ github.event.issue.number }}"
            # 拉取远程最新变更后重试，防止与其他 workflow 并发冲突
            if ! git pull --rebase origin data; then
              echo "::warning::Rebase 冲突，尝试 merge 策略"
              git rebase --abort 2>/dev/null || true
              git pull origin data --no-rebase || true
            fi
            git push origin data || git push -u origin data
          fi

      - name: Close issue with comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ 已自动应用修正并提交到 data 分支。下次分类运行时会生效。"
