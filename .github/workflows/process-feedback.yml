name: Process Classification Feedback

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: "process-feedback"
  cancel-in-progress: false

jobs:
  apply-correction:
    if: |
      contains(github.event.issue.labels.*.name, '分类修正') ||
      startsWith(github.event.issue.title, '[分类修正]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf data
          if git ls-remote --heads "${REPO_URL}" data | grep -q data; then
            git clone --branch data --single-branch "${REPO_URL}" data
          else
            mkdir data && cd data && git init && git remote add origin "${REPO_URL}" && git checkout -b data
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse issue and apply correction
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/ci/apply_feedback_correction.py

      - name: Regenerate learned rules
        run: python3 scripts/ci/regenerate_learned_rules.py

      - name: Commit data changes
        uses: ./.github/actions/commit-and-push
        with:
          repository: ./data
          branch: data
          message: "feedback: apply classification correction from issue #${{ github.event.issue.number }}"

      - name: Close issue with comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ 已自动应用修正并提交到 data 分支。下次分类运行时会生效。"
