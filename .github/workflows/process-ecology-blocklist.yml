name: Process Ecology Blocklist

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: "process-ecology-blocklist"
  cancel-in-progress: false

jobs:
  apply-blocklist:
    if: |
      contains(github.event.issue.labels.*.name, '生态-blocklist') ||
      startsWith(github.event.issue.title, '[生态Blocklist]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf data
          if git ls-remote --heads "${REPO_URL}" data | grep -q data; then
            git clone --branch data --single-branch "${REPO_URL}" data
          else
            mkdir data && cd data && git init && git remote add origin "${REPO_URL}" && git checkout -b data
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply blocklist exclusion
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/ci/apply_ecology_blocklist.py

      - name: Commit blocklist changes
        uses: ./.github/actions/commit-and-push
        with:
          repository: .
          branch: main
          message: "ecology: blocklist update from issue #${{ github.event.issue.number }}"

      - name: Close issue with comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ 已自动更新 ecology_blocklist.yaml 并提交到 main 分支。生态发现将自动生效。"
